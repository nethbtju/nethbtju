<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neth Botheju — Software Engineer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --void:#020408;
  --accent:#4fc3f7;
  --glow:#00e5ff;
  --warm:#ff6b35;
  --purple:#b388ff;
  --green:#69f0ae;
  --amber:#ffd54f;
  --muted:#3a4a6a;
  --text:#c8d8f0;
  --bright:#e8f4ff;
  --mono:'Space Mono',monospace;
  --display:'Syne',sans-serif;
}
html{scroll-behavior:auto}
body{
  background:var(--void);
  color:var(--text);
  font-family:var(--mono);
  overflow:hidden;
  width:100vw;height:100vh;
  cursor:crosshair;
  user-select:none;
}

/* ── CANVAS ── */
#universe{position:fixed;inset:0;z-index:0}

/* ── HUD OVERLAY ── */
#hud{
  position:fixed;inset:0;z-index:10;
  pointer-events:none;
}

/* NAV */
#nav{
  position:fixed;top:0;left:0;right:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;
  padding:1.2rem 3rem;
  pointer-events:all;
}
.nav-logo{
  font-family:var(--display);font-size:1rem;font-weight:800;
  color:var(--accent);letter-spacing:0.05em;cursor:pointer;
}
.nav-links{display:flex;gap:2rem;list-style:none}
.nav-links button{
  background:none;border:none;
  color:var(--muted);font-family:var(--mono);font-size:0.7rem;
  letter-spacing:0.15em;text-transform:uppercase;cursor:pointer;
  transition:color 0.2s;padding:0;
  pointer-events:all;
}
.nav-links button:hover,.nav-links button.active{color:var(--accent)}

/* SCROLL HINT */
#scroll-hint{
  position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:0.5rem;
  font-size:0.6rem;letter-spacing:0.25em;text-transform:uppercase;
  color:var(--muted);transition:opacity 0.5s;z-index:20;
  pointer-events:none;
}
.scroll-arrow{
  width:1px;height:30px;background:var(--muted);
  position:relative;overflow:hidden;
}
.scroll-arrow::after{
  content:'';position:absolute;top:-100%;left:0;
  width:100%;height:100%;background:var(--accent);
  animation:scrollDrop 1.5s ease-in-out infinite;
}
@keyframes scrollDrop{0%{top:-100%}100%{top:100%}}

/* LOCATION BADGE */
#location-badge{
  position:fixed;top:5rem;left:3rem;z-index:20;
  font-size:0.62rem;letter-spacing:0.2em;text-transform:uppercase;
  color:var(--muted);transition:opacity 0.4s;
  pointer-events:none;
}
#location-badge span{color:var(--accent)}

/* SECTION PANEL */
#panel{
  position:fixed;z-index:20;
  right:0;top:0;bottom:0;width:420px;
  background:linear-gradient(to left,rgba(2,4,8,0.97),rgba(2,4,8,0.85));
  border-left:1px solid rgba(79,195,247,0.1);
  padding:6rem 2.5rem 3rem;
  overflow-y:auto;
  transform:translateX(100%);
  transition:transform 0.6s cubic-bezier(0.4,0,0.2,1);
  pointer-events:all;
  scrollbar-width:thin;
  scrollbar-color:rgba(79,195,247,0.2) transparent;
}
#panel.open{transform:translateX(0)}
#panel-close{
  position:absolute;top:1.5rem;right:1.5rem;
  background:none;border:1px solid rgba(79,195,247,0.2);
  color:var(--muted);font-family:var(--mono);font-size:0.7rem;
  padding:0.4rem 0.8rem;cursor:pointer;
  letter-spacing:0.1em;transition:all 0.2s;
}
#panel-close:hover{color:var(--accent);border-color:var(--accent)}

/* PLANET LABEL PANEL (left side) */
#planet-info{
  position:fixed;z-index:20;
  left:3rem;top:50%;transform:translateY(-50%);
  max-width:320px;
  transition:opacity 0.5s;
  pointer-events:none;
}
#planet-info .pi-tag{
  font-size:0.6rem;letter-spacing:0.3em;text-transform:uppercase;
  color:var(--accent);margin-bottom:0.75rem;
  display:flex;align-items:center;gap:0.5rem;
}
#planet-info .pi-tag::before{
  content:'';display:block;width:24px;height:1px;background:var(--accent);
}
#planet-info .pi-name{
  font-family:var(--display);font-size:3.5rem;font-weight:800;
  color:var(--bright);line-height:0.95;letter-spacing:-0.03em;
  margin-bottom:0.75rem;
}
#planet-info .pi-desc{
  font-size:0.8rem;color:var(--muted);line-height:1.7;
  margin-bottom:1.5rem;
}
#planet-info .pi-cta{
  display:inline-flex;align-items:center;gap:0.5rem;
  background:none;border:1px solid rgba(79,195,247,0.3);
  color:var(--accent);font-family:var(--mono);font-size:0.7rem;
  letter-spacing:0.12em;text-transform:uppercase;
  padding:0.6rem 1.2rem;cursor:pointer;
  transition:all 0.2s;pointer-events:all;
}
#planet-info .pi-cta:hover{
  background:rgba(79,195,247,0.08);border-color:var(--accent);
}

/* MOON LABEL */
#moon-info{
  position:fixed;z-index:20;
  left:3rem;top:50%;transform:translateY(-50%);
  max-width:300px;opacity:0;
  transition:opacity 0.4s;pointer-events:none;
}
#moon-info .mi-num{
  font-size:0.6rem;letter-spacing:0.3em;color:var(--muted);
  margin-bottom:0.5rem;
}
#moon-info .mi-name{
  font-family:var(--display);font-size:2rem;font-weight:800;
  color:var(--bright);line-height:1;margin-bottom:0.5rem;
}
#moon-info .mi-subtitle{
  font-size:0.72rem;color:var(--accent);letter-spacing:0.1em;
  margin-bottom:0.75rem;
}
#moon-info .mi-desc{
  font-size:0.78rem;color:var(--muted);line-height:1.7;
  margin-bottom:1rem;
}
#moon-info .mi-tags{display:flex;flex-wrap:wrap;gap:0.35rem;margin-bottom:1rem}
#moon-info .mi-tag{
  font-size:0.6rem;padding:0.2rem 0.55rem;
  border:1px solid rgba(179,136,255,0.25);
  color:var(--purple);letter-spacing:0.07em;
}
#moon-info .mi-open{
  display:inline-flex;align-items:center;gap:0.5rem;
  background:none;border:1px solid rgba(79,195,247,0.3);
  color:var(--accent);font-family:var(--mono);font-size:0.65rem;
  letter-spacing:0.12em;text-transform:uppercase;
  padding:0.5rem 1rem;cursor:pointer;
  transition:all 0.2s;pointer-events:all;
}
#moon-info .mi-open:hover{background:rgba(79,195,247,0.08);border-color:var(--accent)}

/* HERO text (at start) */
#hero-text{
  position:fixed;z-index:20;
  left:3rem;top:50%;transform:translateY(-50%);
  pointer-events:none;transition:opacity 0.5s;
}
#hero-text .ht-label{
  font-size:0.65rem;letter-spacing:0.3em;text-transform:uppercase;
  color:var(--accent);margin-bottom:1rem;
  display:flex;align-items:center;gap:0.75rem;
}
#hero-text .ht-label::before{
  content:'';display:block;width:36px;height:1px;background:var(--accent);
}
#hero-text h1{
  font-family:var(--display);
  font-size:clamp(3rem,6vw,5.5rem);
  font-weight:800;line-height:0.92;
  color:var(--bright);letter-spacing:-0.03em;
  margin-bottom:1.2rem;
}
#hero-text h1 em{color:var(--accent);font-style:normal}
#hero-text .ht-sub{
  max-width:380px;color:var(--muted);
  font-size:0.82rem;line-height:1.8;
}

/* MINI MAP */
#minimap{
  position:fixed;bottom:2rem;right:2rem;z-index:20;
  width:120px;
  pointer-events:none;opacity:0.7;
}
#minimap canvas{width:100%;height:auto}

/* PROGRESS RING */
#progress-ring{
  position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);
  z-index:20;pointer-events:none;
  display:flex;align-items:center;gap:0.5rem;
}
.ring-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--muted);transition:all 0.3s;
}
.ring-dot.active{background:var(--accent);box-shadow:0 0 8px rgba(79,195,247,0.6)}
.ring-dot.visited{background:rgba(79,195,247,0.3)}

/* PANEL CONTENT */
.panel-section-tag{
  font-size:0.6rem;letter-spacing:0.3em;text-transform:uppercase;
  color:var(--accent);background:rgba(79,195,247,0.07);
  border:1px solid rgba(79,195,247,0.15);
  padding:0.25rem 0.7rem;display:inline-block;margin-bottom:1.5rem;
}
.panel-title{
  font-family:var(--display);font-size:1.6rem;font-weight:800;
  color:var(--bright);margin-bottom:0.5rem;letter-spacing:-0.02em;
}
.panel-company{
  font-size:0.7rem;letter-spacing:0.15em;text-transform:uppercase;
  color:var(--accent);margin-bottom:0.25rem;
}
.panel-period{
  font-size:0.65rem;color:var(--muted);letter-spacing:0.1em;
  margin-bottom:1rem;
}
.panel-desc{
  font-size:0.82rem;color:var(--muted);line-height:1.8;
  margin-bottom:1.25rem;
}
.panel-bullets{list-style:none;margin-bottom:1.5rem}
.panel-bullets li{
  font-size:0.78rem;color:var(--text);
  padding:0.4rem 0;border-bottom:1px solid rgba(79,195,247,0.06);
  padding-left:1rem;position:relative;
}
.panel-bullets li::before{
  content:'→';position:absolute;left:0;
  color:var(--accent);font-size:0.7rem;
}
.panel-tags{display:flex;flex-wrap:wrap;gap:0.4rem;margin-bottom:1.5rem}
.panel-tag{
  font-size:0.62rem;padding:0.22rem 0.6rem;
  background:rgba(179,136,255,0.08);
  border:1px solid rgba(179,136,255,0.2);
  color:var(--purple);letter-spacing:0.07em;
}
.panel-status{
  display:inline-block;
  font-size:0.58rem;padding:0.2rem 0.6rem;
  letter-spacing:0.15em;text-transform:uppercase;
  margin-bottom:1rem;
}
.status-live{background:rgba(105,240,174,0.1);border:1px solid rgba(105,240,174,0.25);color:var(--green)}
.status-oss{background:rgba(179,136,255,0.1);border:1px solid rgba(179,136,255,0.25);color:var(--purple)}
.status-wip{background:rgba(255,107,53,0.1);border:1px solid rgba(255,107,53,0.25);color:var(--warm)}
.panel-link{
  display:inline-flex;align-items:center;gap:0.5rem;
  background:rgba(79,195,247,0.08);border:1px solid rgba(79,195,247,0.25);
  color:var(--accent);font-family:var(--mono);font-size:0.7rem;
  letter-spacing:0.1em;text-transform:uppercase;
  padding:0.6rem 1.2rem;cursor:pointer;text-decoration:none;
  transition:all 0.2s;margin-right:0.5rem;margin-bottom:0.5rem;
}
.panel-link:hover{background:rgba(79,195,247,0.15);border-color:var(--accent)}
.panel-divider{
  height:1px;background:rgba(79,195,247,0.08);
  margin:1.5rem 0;
}

/* CONTACT PANEL */
.contact-row{
  display:flex;align-items:center;gap:1rem;
  padding:0.75rem 0;border-bottom:1px solid rgba(79,195,247,0.07);
}
.contact-key{font-size:0.65rem;letter-spacing:0.1em;color:var(--muted);min-width:80px}
.contact-val{font-size:0.78rem;color:var(--text)}
.contact-val a{color:var(--accent);text-decoration:none}

/* SKILLS LIST */
.skill-row{margin-bottom:1rem}
.skill-head{
  display:flex;justify-content:space-between;
  font-size:0.75rem;color:var(--text);margin-bottom:0.35rem;
}
.skill-pct{color:var(--muted)}
.skill-track{height:1.5px;background:rgba(79,195,247,0.1)}
.skill-fill{
  height:100%;
  background:linear-gradient(90deg,var(--accent),var(--purple));
  position:relative;
  transition:width 1.2s cubic-bezier(0.4,0,0.2,1);
}

/* ABOUT TEXT */
.about-para{font-size:0.82rem;color:var(--muted);line-height:1.9;margin-bottom:1rem}

/* Scrollbar */
#panel::-webkit-scrollbar{width:3px}
#panel::-webkit-scrollbar-track{background:transparent}
#panel::-webkit-scrollbar-thumb{background:rgba(79,195,247,0.2);border-radius:2px}

@media(max-width:768px){
  #panel{width:100%;border-left:none;border-top:1px solid rgba(79,195,247,0.1)}
  #hero-text h1{font-size:2.5rem}
  #planet-info .pi-name{font-size:2.2rem}
}
</style>
</head>

function getPlanet(id){ return PLANETS.find(p=>p.id===id) }

function travelTo(id, moonLabel=null){
  isTransitioning = true;
  setTimeout(()=>isTransitioning=false, 800);

  const planet = getPlanet(id);
  if(!planet) return;

  currentTarget = id;
  currentMoonTarget = moonLabel;
  focusedPlanet = planet;
  focusedMoon = moonLabel ? planet.moons.find(m=>m.label===moonLabel) : null;

  // Update nav dots
  document.querySelectorAll('.ring-dot').forEach(d=>{
    d.classList.remove('active');
    const dest = d.getAttribute('data-dest');
    if(dest===id) d.classList.add('active');
    if(DESTINATIONS.indexOf(dest) < DESTINATIONS.indexOf(id)) d.classList.add('visited');
  });

  // Update nav buttons
  document.querySelectorAll('.nav-links button').forEach(b=>b.classList.remove('active'));
  const navBtn = document.getElementById('nav-'+id);
  if(navBtn) navBtn.classList.add('active');

  // Update dest index
  destIndex = Math.max(0, DESTINATIONS.indexOf(id));

  // Hide/show panels
  const heroText = document.getElementById('hero-text');
  const planetInfo = document.getElementById('planet-info');
  const moonInfo = document.getElementById('moon-info');
  const scrollHint = document.getElementById('scroll-hint');

  heroText.style.opacity = (id==='sun') ? '1' : '0';
  heroText.style.pointerEvents = (id==='sun') ? 'none' : 'none';

  if(id==='sun'){
    planetInfo.style.opacity = '0';
    moonInfo.style.opacity = '0';
    scrollHint.style.opacity = '1';
    updateLocation('Earth Orbit');
    cam.tx = 0; cam.ty = 0; cam.tzoom = 0.38;
    closePanel();
    return;
  }

  scrollHint.style.opacity = '0';

  if(moonLabel && focusedMoon){
    // Zoom to moon
    planetInfo.style.opacity = '0';
    const mx = planet.x + Math.cos(focusedMoon.angle) * focusedMoon.dist;
    const my = planet.y + Math.sin(focusedMoon.angle) * focusedMoon.dist;
    cam.tx = mx; cam.ty = my;
    cam.tzoom = Math.min(6, 340 / focusedMoon.r);

    // Moon info
    const mData = DATA[id] && DATA[id].moons ? DATA[id].moons.find(m=>m.name===moonLabel) : null;
    if(mData){
      document.getElementById('mi-num').textContent = mData.num;
      document.getElementById('mi-name').textContent = mData.name;
      document.getElementById('mi-subtitle').textContent = mData.subtitle;
      document.getElementById('mi-desc').textContent = mData.desc;
      const tagsEl = document.getElementById('mi-tags');
      tagsEl.innerHTML = mData.tags.map(tg=>`<span class="mi-tag">${tg}</span>`).join('');
      moonInfo.style.opacity = '1';
      moonInfo.style.pointerEvents = 'all';
    }
    updateLocation(planet.label + ' / ' + moonLabel);
  } else {
    // Zoom to planet
    moonInfo.style.opacity = '0';
    moonInfo.style.pointerEvents = 'none';
    cam.tx = planet.x; cam.ty = planet.y;
    const targetZoom = Math.min(3.5, 200 / planet.r);
    cam.tzoom = targetZoom;

    // Planet info
    const pData = DATA[id];
    if(pData){
      document.getElementById('pi-tag').textContent = pData.tag;
      document.getElementById('pi-name').textContent = pData.name;
      document.getElementById('pi-desc').textContent = pData.desc;
      planetInfo.style.opacity = '1';
      planetInfo.style.pointerEvents = 'all';
      // Color accent
      document.getElementById('pi-cta').style.color = planet.color;
      document.getElementById('pi-cta').style.borderColor = planet.color+'55';
    }
    updateLocation('Approaching ' + planet.label);
  }
}

// ══════════════════════════════════════════════════
//  SCROLL HANDLER
// ══════════════════════════════════════════════════
function handleScroll(delta){
  if(isTransitioning) return;
  scrollAccum += delta;

  // If on a planet with moons, scroll through moons first
  if(currentTarget !== 'sun' && DATA[currentTarget] && DATA[currentTarget].moons && DATA[currentTarget].moons.length > 0){
    const moons = DATA[currentTarget].moons;
    const planet = getPlanet(currentTarget);
    const moonLabels = planet.moons.map(m=>m.label);

    if(scrollAccum > SCROLL_THRESH){
      scrollAccum = 0;
      if(!currentMoonTarget){
        // First moon
        travelTo(currentTarget, moonLabels[0]);
      } else {
        const idx = moonLabels.indexOf(currentMoonTarget);
        if(idx < moonLabels.length - 1){
          travelTo(currentTarget, moonLabels[idx+1]);
        } else {
          // Move to next planet
          goNextPlanet();
        }
      }
    } else if(scrollAccum < -SCROLL_THRESH){
      scrollAccum = 0;
      if(currentMoonTarget){
        const idx = moonLabels.indexOf(currentMoonTarget);
        if(idx > 0){
          travelTo(currentTarget, moonLabels[idx-1]);
        } else {
          travelTo(currentTarget); // back to planet
        }
      } else {
        goPrevPlanet();
      }
    }
    return;
  }

  if(scrollAccum > SCROLL_THRESH){
    scrollAccum = 0;
    goNextPlanet();
  } else if(scrollAccum < -SCROLL_THRESH){
    scrollAccum = 0;
    goPrevPlanet();
  }
}

function goNextPlanet(){
  const idx = DESTINATIONS.indexOf(currentTarget);
  if(idx < DESTINATIONS.length - 1) travelTo(DESTINATIONS[idx+1]);
}
function goPrevPlanet(){
  const idx = DESTINATIONS.indexOf(currentTarget);
  if(idx > 0) travelTo(DESTINATIONS[idx-1]);
}

window.addEventListener('wheel', e=>{ e.preventDefault(); handleScroll(e.deltaY); }, {passive:false});

window.addEventListener('touchstart', e=>{ touchStartY = e.touches[0].clientY });
window.addEventListener('touchend', e=>{
  const dy = touchStartY - e.changedTouches[0].clientY;
  if(Math.abs(dy) > 40) handleScroll(dy * 3);

// Keyboard
window.addEventListener('keydown', e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowRight') handleScroll(200);
  if(e.key==='ArrowUp'||e.key==='ArrowLeft') handleScroll(-200);
  if(e.key==='Escape'){ closePanel(); if(currentMoonTarget) travelTo(currentTarget); }
});

//  DRAW
// ══════════════════════════════════════════════════
function lerp(a,b,t){ return a+(b-a)*t }

function drawSun(p){
  // Corona layers
  for(let i=3;i>=1;i--){
    const g = ctx.createRadialGradient(0,0,p.r*0.8,0,0,p.r*(1+i*0.5));
    g.addColorStop(0,`rgba(255,213,79,${0.04/i})`);
    g.addColorStop(1,'rgba(255,213,79,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,p.r*(1+i*0.5),0,Math.PI*2); ctx.fill();
  }
  // Body
  const g2 = ctx.createRadialGradient(-p.r*0.3,-p.r*0.3,0,0,0,p.r);
  g2.addColorStop(0,'#fff9c4'); g2.addColorStop(0.5,'#ffd54f'); g2.addColorStop(1,'#f57f17');
  ctx.fillStyle=g2; ctx.beginPath(); ctx.arc(0,0,p.r,0,Math.PI*2); ctx.fill();
  // Shimmer
  ctx.globalAlpha=0.15+0.05*Math.sin(t*1.5);
  ctx.fillStyle='rgba(255,255,255,0.3)';
  ctx.beginPath(); ctx.arc(-p.r*0.25,-p.r*0.2,p.r*0.4,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=1;
}

function drawPlanet(p){
  ctx.save(); ctx.translate(p.x, p.y);

  // Glow
  const g = ctx.createRadialGradient(0,0,p.r,0,0,p.r*2.5);
  g.addColorStop(0,p.glowColor||`rgba(255,255,255,0.05)`);
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,p.r*2.5,0,Math.PI*2); ctx.fill();

  if(p.isSun){ drawSun(p); ctx.restore(); return; }

  // Saturn rings (back half)
  if(p.rings){
    ctx.save();
    ctx.scale(1, 0.35);
    for(let ri=0;ri<4;ri++){
      const ro = p.r*(1.4+ri*0.18);
      const ri2 = p.r*(1.28+ri*0.18);
      ctx.beginPath();
      ctx.arc(0,0,ro,Math.PI,0); // top half only for back
      ctx.arc(0,0,ri2,0,Math.PI,true);
      ctx.closePath();
      ctx.fillStyle=`rgba(255,213,79,${0.12-ri*0.02})`;
      ctx.fill();
    }
    ctx.restore();
  }

  // Planet body
  const pb = ctx.createRadialGradient(-p.r*0.3,-p.r*0.3,p.r*0.1,0,0,p.r);
  const pc = p.color;
  pb.addColorStop(0, lighten(pc,0.4));
  pb.addColorStop(0.6, pc);
  pb.addColorStop(1, darken(pc,0.5));
  ctx.fillStyle=pb;
  ctx.beginPath(); ctx.arc(0,0,p.r,0,Math.PI*2); ctx.fill();

  // Cloud bands
  if(p.cloudBands){
    ctx.save(); ctx.clip();
    for(let b=0;b<5;b++){
      const by = -p.r+p.r*0.4*b;
      const bh = p.r*0.18;
      const alpha = 0.05+0.04*Math.sin(t*0.3+b);
      ctx.fillStyle=`rgba(255,255,255,${alpha})`;
      ctx.fillRect(-p.r,by,p.r*2,bh);
    }
    ctx.restore();
  }

  // Atmosphere rim
  const rim = ctx.createRadialGradient(0,0,p.r*0.75,0,0,p.r*1.1);
  rim.addColorStop(0,'rgba(0,0,0,0)');
  rim.addColorStop(0.8,`rgba(0,0,0,0.2)`);
  rim.addColorStop(1,'rgba(0,0,0,0.65)');
  ctx.fillStyle=rim; ctx.beginPath(); ctx.arc(0,0,p.r,0,Math.PI*2); ctx.fill();

  // Highlight
  ctx.globalAlpha=0.25;
  const hl = ctx.createRadialGradient(-p.r*0.35,-p.r*0.35,0,0,0,p.r*0.7);
  hl.addColorStop(0,'rgba(255,255,255,0.7)'); hl.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=hl; ctx.beginPath(); ctx.arc(0,0,p.r,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=1;

  // Saturn rings (front half)
  if(p.rings){
    ctx.save();
    ctx.scale(1, 0.35);
    for(let ri=0;ri<4;ri++){
      const ro = p.r*(1.4+ri*0.18);
      const ri2 = p.r*(1.28+ri*0.18);
      ctx.beginPath();
      ctx.arc(0,0,ro,0,Math.PI); // bottom half only for front
      ctx.arc(0,0,ri2,Math.PI,0,true);
      ctx.closePath();
      ctx.fillStyle=`rgba(255,213,79,${0.14-ri*0.02})`;
      ctx.fill();
    }
    ctx.restore();
  }

  // Moons
  p.moons.forEach(m=>{
    m.angle += m.speed;
    const mx = Math.cos(m.angle)*m.dist;
    const my = Math.sin(m.angle)*m.dist;

    // Moon glow if focused
    const isFocus = focusedMoon && focusedMoon.label===m.label;
    if(isFocus){
      const mg = ctx.createRadialGradient(mx,my,m.r,mx,my,m.r*3);
      mg.addColorStop(0,`rgba(79,195,247,0.15)`);
      mg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=mg; ctx.beginPath(); ctx.arc(mx,my,m.r*3,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='rgba(79,195,247,0.4)';
      ctx.lineWidth=0.5/cam.zoom;
      ctx.setLineDash([3/cam.zoom,4/cam.zoom]);
      ctx.beginPath(); ctx.arc(0,0,m.dist,0,Math.PI*2); ctx.stroke();
      ctx.setLineDash([]);
    }

    // Moon body
    const mb = ctx.createRadialGradient(mx-m.r*0.3,my-m.r*0.3,0,mx,my,m.r);
    mb.addColorStop(0, lighten(m.color,0.3));
    mb.addColorStop(1, darken(m.color,0.4));
    ctx.fillStyle=mb; ctx.beginPath(); ctx.arc(mx,my,m.r,0,Math.PI*2); ctx.fill();

    // Moon shadow
    const ms = ctx.createRadialGradient(mx+m.r*0.3,my+m.r*0.3,0,mx,my,m.r);
    ms.addColorStop(0,'rgba(0,0,0,0)'); ms.addColorStop(1,'rgba(0,0,0,0.5)');
    ctx.fillStyle=ms; ctx.beginPath(); ctx.arc(mx,my,m.r,0,Math.PI*2); ctx.fill();

    // Moon label (only when somewhat zoomed in)
    if(cam.zoom > 0.8){
      ctx.font=`${11/cam.zoom}px 'Space Mono'`;
      ctx.fillStyle = isFocus ? 'rgba(79,195,247,0.9)' : 'rgba(200,216,240,0.5)';
      ctx.textAlign='center';
      ctx.fillText(m.label, mx, my - m.r - 6/cam.zoom);
    }
  });

  // Planet label
  if(cam.zoom < 1.5){
    ctx.font=`${12/cam.zoom}px 'Space Mono'`;
    ctx.fillStyle = focusedPlanet && focusedPlanet.id===p.id
      ? (p.color||'rgba(200,216,240,0.9)')
      : 'rgba(200,216,240,0.5)';
    ctx.textAlign='center';
    ctx.fillText(p.label, 0, p.r + 20/cam.zoom);
  }

  ctx.restore();
}

function lighten(hex, amt){
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgb(${Math.min(255,r+amt*255)},${Math.min(255,g+amt*255)},${Math.min(255,b+amt*255)})`;
}
function darken(hex, amt){
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgb(${Math.max(0,r-amt*255)},${Math.max(0,g-amt*255)},${Math.max(0,b-amt*255)})`;
}

function drawOrbits(){
  // Draw faint orbital paths
  const sunPlanetDistances = PLANETS.filter(p=>!p.isSun).map(p=>Math.sqrt(p.x*p.x+p.y*p.y));
  PLANETS.filter(p=>!p.isSun).forEach(p=>{
    const dist = Math.sqrt(p.x*p.x+p.y*p.y);
    const angle = Math.atan2(p.y, p.x);
    ctx.save();
    ctx.rotate(angle);
    ctx.scale(1, 0.5);
    ctx.strokeStyle='rgba(79,195,247,0.03)';
    ctx.lineWidth=1/cam.zoom;
    ctx.beginPath(); ctx.arc(0,0,dist,0,Math.PI*2); ctx.stroke();
    ctx.restore();
  });
}

// ══════════════════════════════════════════════════
//  MAIN LOOP
// ══════════════════════════════════════════════════
function loop(){
  t += 0.016;

  // Smooth camera
  const spd = 0.045;
  cam.x = lerp(cam.x, cam.tx, spd);
  cam.y = lerp(cam.y, cam.ty, spd);
  cam.zoom = lerp(cam.zoom, cam.tzoom, spd);

  // Update focused moon target position for accurate zoom
  if(focusedMoon && focusedPlanet){
    const mx = focusedPlanet.x + Math.cos(focusedMoon.angle) * focusedMoon.dist;
    const my = focusedPlanet.y + Math.sin(focusedMoon.angle) * focusedMoon.dist;
    cam.tx = mx; cam.ty = my;
  }

  ctx.clearRect(0, 0, W, H);

  // Background gradient
  const bg = ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H));
  bg.addColorStop(0,'#030612'); bg.addColorStop(1,'#010206');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  // Nebulae (parallax layer 0)
  nebulae.forEach(n=>{
    const nx = W/2 + (n.x - cam.x) * 0.15;
    const ny = H/2 + (n.y - cam.y) * 0.15;
    const gr = ctx.createRadialGradient(nx,ny,0,nx,ny,n.r);
    gr.addColorStop(0,`hsla(${n.hue},60%,40%,${n.a})`);
    gr.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=gr; ctx.fillRect(0,0,W,H);
  });

  // Stars (parallax layers)
  stars.forEach(s=>{
    const parallax = [0.05, 0.15, 0.4][s.layer];
    const sx = W/2 + (s.x - cam.x) * parallax;
    const sy = H/2 + (s.y - cam.y) * parallax;
    if(sx<-10||sx>W+10||sy<-10||sy>H+10) return;
    const alpha = s.a * (0.4 + 0.6*Math.abs(Math.sin(t*s.twinkleSpeed*60 + s.twinkle)));
    ctx.globalAlpha=alpha;
    ctx.fillStyle='#c8d8f0';
    ctx.beginPath(); ctx.arc(sx,sy,s.r*(0.5+s.layer*0.4),0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1;

  // World transform
  ctx.save();
  ctx.translate(W/2, H/2);
  ctx.scale(cam.zoom, cam.zoom);
  ctx.translate(-cam.x, -cam.y);

  drawOrbits();
  PLANETS.forEach(p=>drawPlanet(p));

  ctx.restore();

  requestAnimationFrame(loop);
}

// ══════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════
// Start at home view
cam.tx=0; cam.ty=0; cam.tzoom=0.38;
cam.x=0; cam.y=0; cam.zoom=0.38;

loop();

// Start animation then hint
setTimeout(()=>{
  document.getElementById('scroll-hint').style.opacity='1';
},1000);
</script>
